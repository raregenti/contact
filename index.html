<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Your Name | Contact</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .name {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .description {
            color: #888;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 55px;

            border: 1px solid #333;
            border-radius: 14px;

            color: #fff;
            text-decoration: none;

            font-size: 16px;
            font-weight: 500;

            background: #111;

            transition: 0.2s;
        }

        .button:hover {
            background: #1c1c1c;
            border-color: #555;
            transform: translateY(-1px);
        }

        .save {
            background: #fff;
            color: #000;
            border-color: #fff;
            margin-bottom: 8px;
        }

        .save:hover {
            background: #ddd;
            border-color: #ddd;
        }

        .footer {
            margin-top: 30px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="card">

        <h1 class="name">Genti</h1>

        <div class="buttons">

            <!-- Save Contact -->
            <a class="button save" href="contact.vcf">
                Save Contact
            </a>

            <!-- Call -->
            <a class="button" href="tel:+38343921000">
                Call Me
            </a>

            <!-- WhatsApp -->
            <a class="button"
               href="https://wa.me/38343921000">
                WhatsApp
            </a>

            <!-- Viber -->
            <a class="button"
               href="viber://chat?number=%2B38343921000">
                Viber
            </a>

            <!-- Instagram -->
            <a class="button"
               href="https://instagram.com/zzzgenti">
                Instagram
            </a>

            <!-- Snapchat -->
            <a class="button"
               href="https://www.snapchat.com/add/gentisadiku">
                Snapchat
            </a>

        </div>

        <p class="footer">
            Tap • Connect • Save
        </p>

    </main>

</body>
</html>
